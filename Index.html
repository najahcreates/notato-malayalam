        * { box-sizing: border-box; margin: 0; padding: 0; }

        @media (max-width: 768px) {

<script>
    let archive = JSON.parse(localStorage.getItem('notato_v5_docs')) || [];
    let currentId = null;
    let isSplitActive = false;
    let isManglishOn = true;
    let suggestionArray = [];
    let activeSuggIdx = -1;
    let saveTimeout = null;
    let voiceRecognition = null;
    let isRecordingVoice = false;
    let isSpeaking = false;

    // Zero-Lag Cache Engine State
    const translitCache = new Map();
    let activeAbortController = null;
    let debounceTimer = null;

    const targetEditor = document.getElementById('target-editor');
    const sourceEditor = document.getElementById('source-editor');
    const sourcePage = document.getElementById('source-page');
    const viewportScroll = document.getElementById('viewport-scroll');
    const suggFloat = document.getElementById('sugg-float');
    const titleInput = document.getElementById('doc-title');
    const saveStatus = document.getElementById('save-status');
    const wordStat = document.getElementById('word-stat');
    const charStat = document.getElementById('char-stat');
    const readStat = document.getElementById('read-stat');
    const langBtn = document.getElementById('lang-btn');
    const langBadge = document.getElementById('lang-status-badge');
    const syncScroll = document.getElementById('sync-scroll-check');
    const ttsBtn = document.getElementById('tts-btn');

    function init() {
        if (archive.length === 0) {
            createNewDoc();
        } else {
            archive.sort((a, b) => b.updatedAt - a.updatedAt);
            currentId = archive[0].id;
            loadCurrentDoc();
        }

        if (localStorage.getItem('notato_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('theme-ico').className = 'fas fa-sun';
        }

        targetEditor.addEventListener('paste', handleCleanPaste);
        sourceEditor.addEventListener('paste', handleCleanPaste);

        initScrollSync();
        initSpeech();
    }

    function createNewDoc() {
        const doc = {
            id: 'doc_' + Date.now(),
            title: '',
            sourceText: '',
            targetText: '',
            updatedAt: Date.now()
        };
        archive.unshift(doc);
        currentId = doc.id;
        syncStorage();
        loadCurrentDoc();
        targetEditor.focus();
    }

    function loadCurrentDoc() {
        const item = archive.find(d => d.id === currentId);
        if (!item) return;

        titleInput.value = item.title || '';
        targetEditor.innerHTML = item.targetText || '';
        sourceEditor.innerHTML = item.sourceText || '';
        refreshMetrics();
        hideSuggestions();
    }

    function updateDocTitle(val) {
        const doc = archive.find(d => d.id === currentId);
        if (doc) {
            doc.title = val;
            doc.updatedAt = Date.now();
            syncStorage();
        }
    }

    function queueSave() {
        saveStatus.innerText = 'Saving...';
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            const doc = archive.find(d => d.id === currentId);
            if (doc) {
                doc.targetText = targetEditor.innerHTML;
                doc.sourceText = sourceEditor.innerHTML;
                doc.updatedAt = Date.now();
                
                archive = [doc, ...archive.filter(d => d.id !== currentId)];
                syncStorage();
                saveStatus.innerText = 'Saved';
            }
        }, 500);
    }

    function syncStorage() {
        localStorage.setItem('notato_v5_docs', JSON.stringify(archive));
    }

    function handleCleanPaste(e) {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, text);
        queueSave();
        refreshMetrics();
    }

    function clearFormatting() {
        document.execCommand('removeFormat', false, null);
        targetEditor.focus();
        queueSave();
    }

    function formatText(cmd, val = null) {
        document.execCommand(cmd, false, val);
        targetEditor.focus();
        queueSave();
    }

    function refreshMetrics() {
        const text = (targetEditor.innerText || '').trim();
        const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
        const chars = text.length;
        const readTime = Math.ceil(words / 130);

        wordStat.innerText = `${words} words`;
        charStat.innerText = `${chars} characters`;
        readStat.innerText = `${readTime} min read`;
    }

    function filterModalDocs() {
        const query = document.getElementById('modal-search').value.toLowerCase();
        const container = document.getElementById('modal-docs-list');
        container.innerHTML = '';

        const matches = archive.filter(d => {
            return (d.title || 'Untitled Document').toLowerCase().includes(query) || (d.targetText || '').toLowerCase().includes(query);
        });

        matches.forEach(doc => {
            const temp = document.createElement('div');
            temp.innerHTML = doc.targetText;
            const plain = (temp.innerText || '').slice(0, 55) || 'Empty note...';
            const title = doc.title || (plain.slice(0, 24) || 'Untitled Note');

            const item = document.createElement('div');
            item.className = `doc-item-row ${doc.id === currentId ? 'active' : ''}`;
            item.onclick = () => {
                currentId = doc.id;
                loadCurrentDoc();
                bootstrap.Modal.getInstance(document.getElementById('filesModal')).hide();
            };

            item.innerHTML = `
                <div>
                    <div style="font-weight: 600;">${title}</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">${plain}</div>
                </div>
                <button class="icon-btn" onclick="deleteDoc('${doc.id}', event)" title="Delete"><i class="fas fa-trash-can"></i></button>
            `;
            container.appendChild(item);
        });
    }

    document.getElementById('filesModal').addEventListener('show.bs.modal', filterModalDocs);

    function deleteDoc(id, e) {
        e.stopPropagation();
        if (confirm("Permanently delete this note?")) {
            archive = archive.filter(d => d.id !== id);
            syncStorage();
            if (archive.length === 0) createNewDoc();
            else if (currentId === id) {
                currentId = archive[0].id;
                loadCurrentDoc();
            }
            filterModalDocs();
        }
    }

    /* --- High-Performance Transliteration Engine with Cache & Abort Control --- */
    async function fetchPhoneticList(token) {
        const cleanToken = token.trim().toLowerCase();
        if (!cleanToken) return [];

        if (translitCache.has(cleanToken)) {
            return translitCache.get(cleanToken);
        }

        if (activeAbortController) {
            activeAbortController.abort();
        }
        activeAbortController = new AbortController();

        try {
            const url = `https://inputtools.google.com/request?text=${encodeURIComponent(cleanToken)}&itc=ml-t-i0-und&num=6&cp=0&cs=1&ie=utf-8&oe=utf-8`;
            const res = await fetch(url, { signal: activeAbortController.signal });
            const data = await res.json();

            if (data[0] === 'SUCCESS' && data[1] && data[1][0]) {
                const results = data[1][0][1];
                if (translitCache.size > 500) {
                    const firstKey = translitCache.keys().next().value;
                    translitCache.delete(firstKey);
                }
                translitCache.set(cleanToken, results);
                return results;
            }
            return [];
        } catch (err) {
            return [];
        }
    }

    function parseCursorToken() {
        const sel = window.getSelection();
        if (!sel.rangeCount) return null;
        const range = sel.getRangeAt(0);
        const node = range.startContainer;
        if (node.nodeType !== Node.TEXT_NODE) return null;
        
        const textBefore = node.textContent.substring(0, range.startOffset);
        const match = textBefore.match(/([a-zA-Z]+)$/);
        if (match) {
            return {
                word: match[1],
                start: range.startOffset - match[1].length,
                end: range.startOffset,
                node: node
            };
        }
        return null;
    }

    function insertPhoneticWord(chosen) {
        const tokenData = parseCursorToken();
        if (!tokenData) return;

        const { node, start, end } = tokenData;
        const full = node.textContent;
        node.textContent = full.substring(0, start) + chosen + "\u00A0" + full.substring(end);

        const sel = window.getSelection();
        const newRange = document.createRange();
        newRange.setStart(node, start + chosen.length + 1);
        newRange.collapse(true);
        sel.removeAllRanges();
        sel.addRange(newRange);

        hideSuggestions();
        queueSave();
        refreshMetrics();
    }

    function hideSuggestions() {
        suggestionArray = [];
        activeSuggIdx = -1;
        suggFloat.style.display = 'none';
        suggFloat.innerHTML = '';
    }

    function renderFloatSuggestions() {
        if (suggestionArray.length === 0) {
            hideSuggestions();
            return;
        }

        suggFloat.innerHTML = '';
        suggestionArray.forEach((w, idx) => {
            const chip = document.createElement('span');
            chip.className = `sugg-chip ${idx === activeSuggIdx ? 'active-chip' : ''}`;
            chip.innerText = w;
            chip.onmousedown = (e) => {
                e.preventDefault();
                insertPhoneticWord(w);
            };
            suggFloat.appendChild(chip);
        });
        suggFloat.style.display = 'flex';
    }

    /* Optimized Input Listener with Cache-First Fallback & 90ms Debounce */
    targetEditor.addEventListener('input', () => {
        queueSave();
        refreshMetrics();

        if (!isManglishOn) return;

        const token = parseCursorToken();
        if (!token || token.word.length === 0) {
            hideSuggestions();
            return;
        }

        const cleanWord = token.word.toLowerCase();
        if (translitCache.has(cleanWord)) {
            suggestionArray = translitCache.get(cleanWord);
            activeSuggIdx = suggestionArray.length > 0 ? 0 : -1;
            renderFloatSuggestions();
            return;
        }

        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(async () => {
            const latestToken = parseCursorToken();
            if (latestToken && latestToken.word.length > 0) {
                suggestionArray = await fetchPhoneticList(latestToken.word);
                activeSuggIdx = suggestionArray.length > 0 ? 0 : -1;
                renderFloatSuggestions();
            } else {
                hideSuggestions();
            }
        }, 90);
    });

    targetEditor.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.code === 'Space') {
            e.preventDefault();
            toggleEngine();
            return;
        }

        if (suggestionArray.length > 0 && isManglishOn) {
            if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
                e.preventDefault();
                activeSuggIdx = (activeSuggIdx + 1) % suggestionArray.length;
                renderFloatSuggestions();
                return;
            }
            if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
                e.preventDefault();
                activeSuggIdx = (activeSuggIdx - 1 + suggestionArray.length) % suggestionArray.length;
                renderFloatSuggestions();
                return;
            }
            if (e.code === 'Space' || e.code === 'Enter') {
                if (activeSuggIdx >= 0) {
                    e.preventDefault();
                    insertPhoneticWord(suggestionArray[activeSuggIdx]);
                    return;
                }
            }
            if (e.code === 'Escape') {
                e.preventDefault();
                hideSuggestions();
                return;
            }
        }
    });

    sourceEditor.addEventListener('input', queueSave);

    function toggleEngine() {
        isManglishOn = !isManglishOn;
        if (isManglishOn) {
            langBtn.classList.add('active');
            langBadge.innerHTML = '<i class="fas fa-pen-nib me-1"></i> Malayalam Canvas';
        } else {
            langBtn.classList.remove('active');
            langBadge.innerHTML = '<i class="fas fa-keyboard me-1"></i> English Canvas';
            hideSuggestions();
        }
        targetEditor.focus();
    }

    function toggleSplitCanvas() {
        isSplitActive = !isSplitActive;
        sourcePage.classList.toggle('d-none', !isSplitActive);
        viewportScroll.classList.toggle('split-on', isSplitActive);
        document.getElementById('split-btn').classList.toggle('active', isSplitActive);
    }

    function initScrollSync() {
        let isSyncing = false;
        const bind = (el1, el2) => {
            el1.addEventListener('scroll', () => {
                if (!syncScroll.checked || isSyncing) return;
                isSyncing = true;
                const ratio = el1.scrollTop / (el1.scrollHeight - el1.clientHeight);
                el2.scrollTop = ratio * (el2.scrollHeight - el2.clientHeight);
                setTimeout(() => isSyncing = false, 40);
            });
        };
        bind(sourceEditor, targetEditor);
        bind(targetEditor, sourceEditor);
    }

    function initSpeech() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            voiceRecognition = new Speech();
            voiceRecognition.continuous = true;
            voiceRecognition.lang = 'ml-IN';

            voiceRecognition.onresult = (e) => {
                const phrase = e.results[e.results.length - 1][0].transcript;
                document.execCommand('insertText', false, phrase + ' ');
                queueSave();
            };
            voiceRecognition.onend = () => haltVoice();
            voiceRecognition.onerror = () => haltVoice();
        }
    }

    function toggleVoiceDictation() {
        if (!voiceRecognition) {
            alert("Speech recognition is only supported on Chromium-based browsers.");
            return;
        }
        if (isRecordingVoice) haltVoice();
        else {
            voiceRecognition.start();
            isRecordingVoice = true;
            document.getElementById('mic-btn').classList.add('active');
        }
    }

    function haltVoice() {
        if (isRecordingVoice && voiceRecognition) voiceRecognition.stop();
        isRecordingVoice = false;
        document.getElementById('mic-btn').classList.remove('active');
    }

    function toggleSpeechReadout() {
        if (!('speechSynthesis' in window)) {
            alert("Text-to-speech is not supported on this browser.");
            return;
        }

        if (isSpeaking) {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            ttsBtn.classList.remove('active');
            return;
        }

        const textToRead = targetEditor.innerText.trim();
        if (!textToRead) return;

        const utterance = new SpeechSynthesisUtterance(textToRead);
        const voices = window.speechSynthesis.getVoices();
        const mlVoice = voices.find(v => v.lang.includes('ml') || v.lang.includes('ml-IN'));
        if (mlVoice) utterance.voice = mlVoice;
        utterance.rate = 0.95;

        utterance.onend = () => { isSpeaking = false; ttsBtn.classList.remove('active'); };
        utterance.onerror = () => { isSpeaking = false; ttsBtn.classList.remove('active'); };

        window.speechSynthesis.speak(utterance);
        isSpeaking = true;
        ttsBtn.classList.add('active');
    }

    function toggleColorTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('notato_theme', 'light');
            document.getElementById('theme-ico').className = 'fas fa-moon';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('notato_theme', 'dark');
            document.getElementById('theme-ico').className = 'fas fa-sun';
        }
    }

    function exportDoc(ext) {
        const raw = targetEditor.innerText.trim();
        const title = (titleInput.value || 'untitled_doc').replace(/[^a-z0-9]/gi, '_').toLowerCase();
        let mime = 'text/plain';
        let body = raw;

        if (ext === 'md') body = `# ${titleInput.value || 'Document'}\n\n${raw}`;
        else if (ext === 'doc') {
            mime = 'application/msword';
            body = `<html><body>${targetEditor.innerHTML}</body></html>`;
        }

        const blob = new Blob([body], { type: `${mime};charset=utf-8` });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${title}.${ext}`;
        link.click();
        URL.revokeObjectURL(link.href);
    }

    function copyPlainDoc() {
        navigator.clipboard.writeText(targetEditor.innerText);
        saveStatus.innerText = 'Copied!';
        setTimeout(() => saveStatus.innerText = 'Saved', 1500);
    }

    init();
</script>

    <style>
        :root {
            /* Light Warm Sand Palette */
            --bg: #f5f3ee;
            --surface: #eae6df;
            --surface-card: #e0dad0;
            --border: #d2cabb;
            --ink: #1e1e24;
            --ink-muted: #6e6a66;
            --accent: #d34e36;
            --accent-glow: rgba(211, 78, 54, 0.15);
            --green: #2ecc71;
            --sidebar-w: 280px;
            --mono: 'DM Mono', monospace;
            --radius: 12px;
        }

        [data-theme="dark"] {
            /* Tokyo Night / Cyber-Zen Slate Palette */
            --bg: #1a1b26;
            --surface: #24283b;
            --surface-card: #2f354f;
            --border: #3b4261;
            --ink: #c0caf5;
            --ink-muted: #7982a9;
            --accent: #f7768e;
            --accent-glow: rgba(247, 118, 142, 0.2);
            --green: #9ece6a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--ink);
            height: 100vh;
            overflow: hidden;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .shell { display: flex; height: 100vh; width: 100vw; position: relative; }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 300;
        }

        .sidebar-head { padding: 16px; border-bottom: 1px solid var(--border); }
        .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .brand { display: flex; flex-direction: column; }
        .brand-ml { font-family: 'Noto Serif Malayalam', serif; font-weight: 700; font-size: 1.2rem; color: var(--accent); line-height: 1.1; }
        .brand-en { font-family: var(--mono); font-size: 0.6rem; color: var(--ink-muted); letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; }
        .brand-en:hover { color: var(--accent); }
        .brand-badge { background: var(--accent); color: white; font-family: var(--mono); font-size: 0.58rem; padding: 2px 7px; border-radius: 12px; font-weight: 600; }

        .search-bar { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 8px; padding: 7px 10px; border: 1px solid var(--border); }
        .search-bar input { flex: 1; background: none; border: none; outline: none; font-size: 0.82rem; color: var(--ink); font-family: 'Inter', sans-serif; }
        .search-bar i { color: var(--ink-muted); font-size: 0.78rem; }

        .notes-meta { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 6px; }
        .notes-meta-label { font-size: 0.65rem; font-family: var(--mono); color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.1em; }
        .btn-new { background: var(--accent); color: white; border: none; border-radius: 8px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s ease; }
        .btn-new:active { transform: scale(0.92); }

        .notes-list { flex: 1; overflow-y: auto; padding: 8px; }
        .note-card { padding: 12px 14px; border-radius: var(--radius); cursor: pointer; margin-bottom: 6px; border: 1px solid transparent; transition: all 0.15s; position: relative; }
        .note-card:hover { background: var(--surface-card); }
        .note-card.active { background: var(--accent-glow); border-color: var(--accent); }
        .note-card-title { font-family: 'Noto Serif Malayalam', serif; font-size: 0.9rem; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 22px; }
        .note-card-preview { font-size: 0.74rem; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .note-card-date { font-family: var(--mono); font-size: 0.62rem; color: var(--ink-muted); margin-top: 6px; opacity: 0.8; }
        .btn-del { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--ink-muted); opacity: 0; cursor: pointer; font-size: 0.8rem; padding: 2px; }
        .note-card:hover .btn-del { opacity: 1; }
        .btn-del:hover { color: var(--accent); }

        /* MAIN */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .topbar { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; background: var(--bg); }
        .mob-toggle { display: none; background: none; border: none; color: var(--ink); font-size: 1.1rem; cursor: pointer; padding: 4px; }
        .topbar-tools { display: flex; gap: 6px; margin-left: auto; align-items: center; }
        
        .tool-btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            gap: 6px; 
            background: var(--surface); 
            border: 1px solid var(--border); 
            color: var(--ink); 
            border-radius: 8px; 
            padding: 6px 11px; 
            font-size: 0.78rem; 
            font-family: var(--mono); 
            cursor: pointer; 
            transition: all 0.15s ease; 
            text-decoration: none; 
            min-height: 32px;
        }

        .tool-btn.on { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); font-weight: 600; }

        /* FORMATBAR */
        .fmt-bar { 
            display: flex; 
            gap: 2px; 
            padding: 6px 16px; 
            background: var(--surface); 
            border-bottom: 1px solid var(--border); 
            overflow-x: auto; 
            scrollbar-width: none;
            align-items: center; 
            flex-shrink: 0;
        }
        .fmt-bar::-webkit-scrollbar { display: none; }
        .fmt-btn { background: none; border: 1px solid transparent; color: var(--ink); padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; flex-shrink: 0; }
        .fmt-btn:hover { background: var(--surface-card); }
        .fmt-sep { width: 1px; height: 14px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

        /* STATBAR */
        .stat-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 4px 16px; display: flex; gap: 14px; align-items: center; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
        .stat-bar::-webkit-scrollbar { display: none; }
        .stat-item { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 0.68rem; color: var(--ink-muted); white-space: nowrap; }
        .stat-val { color: var(--ink); font-weight: 500; }
        .stat-divider { width: 1px; height: 10px; background: var(--border); flex-shrink: 0; }
        .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); transition: background 0.3s; flex-shrink: 0; }
        .save-dot.saving { background: #e0af68; }
        .save-dot.unsaved { background: var(--accent); }

        /* EDITOR AREA */
        .editor-wrap { flex: 1; display: flex; flex-direction: column; padding: 18px 24px 12px; max-width: 800px; width: 100%; margin: 0 auto; overflow: hidden; }
        
        .sugg-bar { display: flex; gap: 6px; margin-bottom: 12px; min-height: 34px; overflow-x: auto; scrollbar-width: none; align-items: center; flex-shrink: 0; }
        .sugg-bar::-webkit-scrollbar { display: none; }
        .sugg-hint { font-family: var(--mono); font-size: 0.62rem; color: var(--ink-muted); white-space: nowrap; }
        
        .chip { position: relative; background: var(--surface); color: var(--ink); padding: 5px 12px 5px 22px; border-radius: 18px; cursor: pointer; font-family: 'Noto Sans Malayalam', sans-serif; font-size: 0.92rem; white-space: nowrap; border: 1px solid var(--border); transition: all 0.12s ease; }
        .chip-num { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 0.58rem; color: var(--ink-muted); }
        .chip:hover, .chip.active { background: var(--accent); border-color: var(--accent); color: white; }
        .chip.active .chip-num { color: rgba(255,255,255,0.85); }

        .editor { flex: 1; width: 100%; border: none; outline: none; font-size: 1.2rem; font-family: 'Noto Serif Malayalam', serif; line-height: 1.85; color: var(--ink); overflow-y: auto; padding-bottom: 60px; }
        .editor[contenteditable]:empty:before { content: attr(placeholder); color: var(--ink-muted); opacity: 0.5; font-style: italic; cursor: text; }

        /* HINT BANNER */
        .hint-banner { background: var(--accent-glow); border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 10px; font-size: 0.8rem; line-height: 1.4; }
        .hint-banner i { color: var(--accent); margin-top: 2px; flex-shrink: 0; }
        .hint-banner a { color: var(--accent); font-weight: 600; text-decoration: underline; }
        .hint-close { margin-left: auto; background: none; border: none; color: var(--ink-muted); cursor: pointer; padding: 2px; }

        /* OVERLAY FOR MOBILE SIDEBAR */
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 250; backdrop-filter: blur(2px); }

        /* TOAST */
        .toast-shelf { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 9999; pointer-events: none; }
        .toast { background: var(--ink); color: var(--bg); padding: 8px 18px; border-radius: 20px; font-size: 0.78rem; font-family: var(--mono); opacity: 0; transform: translateY(10px); animation: toastIn 0.2s forwards, toastOut 0.2s 2s forwards; }

        @keyframes toastIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

        /* RESPONSIVE MOBILE STYLES */
        @media (max-width: 720px) {
            .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); box-shadow: 6px 0 24px rgba(0,0,0,0.2); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .mob-toggle { display: block; }
            
            .tool-btn span.btn-text { display: none; }
            .tool-btn { padding: 6px 9px; min-width: 32px; }

            .topbar { padding: 8px 12px; }
            .fmt-bar { padding: 5px 12px; }
            .stat-bar { padding: 4px 12px; }
            .editor-wrap { padding: 12px 14px 8px; }
            .editor { font-size: 1.05rem; }
            .btn-del { opacity: 1; }
        }
    </style>
</head>

<script>
let notes = JSON.parse(localStorage.getItem('mgl_notes_v2')) || [];
let activeId = null;
let saveTimer = null;
let mlEnabled = true;
let suggestions = [];
let activeWord = '';
let activeSuggIdx = 0;

const editor = document.getElementById('editor');
const suggBar = document.getElementById('sugg-bar');
const suggHint = document.getElementById('sugg-hint');
const notesList = document.getElementById('notes-list');
const langBtn = document.getElementById('lang-btn');
const langLabel = document.getElementById('lang-label');
const saveDot = document.getElementById('save-dot');
const saveLabel = document.getElementById('save-label');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebar-overlay');
const themeBtn = document.getElementById('theme-btn');
const hintBanner = document.getElementById('hint-banner');

function init() {
    const savedTheme = localStorage.getItem('mgl_theme') || 'dark';
    applyTheme(savedTheme);

    if (!localStorage.getItem('mgl_hint_seen')) hintBanner.style.display = 'flex';

    if (notes.length === 0) {
        createNote(true);
    } else {
        notes.sort((a, b) => b.ts - a.ts);
        activeId = notes[0].id;
        loadNote();
        renderList();
    }
    editor.focus();
}

function execCmd(cmd, value = null) {
    document.execCommand(cmd, false, value);
    editor.focus();
}

function applyTheme(t) {
    document.body.setAttribute('data-theme', t);
    localStorage.setItem('mgl_theme', t);
    themeBtn.innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
}

function toggleTheme() {
    applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

function dismissHint() {
    hintBanner.style.display = 'none';
    localStorage.setItem('mgl_hint_seen', '1');
}

function createNote(silent = false) {
    const note = { id: Date.now().toString(), content: '', ts: Date.now() };
    notes.unshift(note);
    activeId = note.id;
    save();
    loadNote();
    renderList();
    editor.focus();
    closeSidebar();
    if (!silent) toast('New note created');
}

function loadNote() {
    const n = getActive();
    if (n) {
        editor.innerHTML = n.content;
        clearSugg();
        updateStats();
        setSaveStatus('saved');
    }
}

function getActive() { return notes.find(n => n.id === activeId); }

function deleteNote(id, e) {
    e.stopPropagation();
    if (!confirm('Delete this note?')) return;
    notes = notes.filter(n => n.id !== id);
    save();
    if (notes.length === 0) createNote(true);
    else if (activeId === id) { activeId = notes[0].id; loadNote(); }
    renderList();
    toast('Note deleted');
}

function save() { localStorage.setItem('mgl_notes_v2', JSON.stringify(notes)); }

function filterNotes(q) { renderList(q.toLowerCase()); }

function renderList(filter = '') {
    notesList.innerHTML = '';
    const visible = notes.filter(n => !filter || n.content.toLowerCase().includes(filter));
    document.getElementById('notes-count-label').textContent = `${visible.length} note${visible.length !== 1 ? 's' : ''}`;

    visible.forEach(n => {
        const tmp = document.createElement('div');
        tmp.innerHTML = n.content;
        const text = tmp.textContent || tmp.innerText || 'Empty note...';
        const title = text.trim().split('\n')[0].substring(0, 28) || 'Untitled Note';
        const date = new Date(n.ts).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

        const el = document.createElement('div');
        el.className = `note-card ${n.id === activeId ? 'active' : ''}`;
        el.onclick = () => { activeId = n.id; loadNote(); renderList(filter); closeSidebar(); };
        el.innerHTML = `
            <div class="note-card-title">${title}</div>
            <div class="note-card-preview">${text.substring(0, 45)}</div>
            <div class="note-card-date">${date}</div>
            <button class="btn-del" onclick="deleteNote('${n.id}', event)" title="Delete"><i class="fas fa-trash-alt"></i></button>
        `;
        notesList.appendChild(el);
    });
}

editor.addEventListener('input', () => {
    setSaveStatus('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        const n = getActive();
        if (n) {
            n.content = editor.innerHTML;
            n.ts = Date.now();
            notes = [n, ...notes.filter(x => x.id !== n.id)];
            save();
            renderList(document.getElementById('search-input').value.toLowerCase());
            setSaveStatus('saved');
        }
    }, 800);
    updateStats();
    handleTransliteration();
});

function updateStats() {
    const text = editor.textContent || '';
    const chars = text.length;
    const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    document.getElementById('s-chars').textContent = chars.toLocaleString();
    document.getElementById('s-words').textContent = words.toLocaleString();
    document.getElementById('s-read').textContent = Math.max(1, Math.round(words / 200));
}

function setSaveStatus(state) {
    saveDot.className = 'save-dot' + (state === 'saving' ? ' saving' : state === 'unsaved' ? ' unsaved' : '');
    saveLabel.textContent = state === 'saving' ? 'saving...' : state === 'unsaved' ? 'unsaved' : 'saved';
}

function toggleLang() {
    mlEnabled = !mlEnabled;
    langBtn.className = `tool-btn${mlEnabled ? ' on' : ''}`;
    langLabel.textContent = mlEnabled ? 'ML ON' : 'EN ON';
    if (!mlEnabled) clearSugg();
    toast(mlEnabled ? 'Malayalam mode on' : 'English mode on');
    editor.focus();
}

async function fetchSugg(text) {
    if (!text.trim()) return [];
    try {
        const url = `https://inputtools.google.com/request?text=${encodeURIComponent(text)}&itc=ml-t-i0-und&num=6&cp=0&cs=1&ie=utf-8&oe=utf-8`;
        const res = await fetch(url);
        const data = await res.json();
        return data[0] === 'SUCCESS' ? data[1][0][1] : [];
    } catch { return []; }
}

async function handleTransliteration() {
    if (!mlEnabled) return;
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const node = sel.anchorNode;
    if (node.nodeType !== Node.TEXT_NODE) { clearSugg(); return; }

    const textBefore = node.textContent.substring(0, sel.anchorOffset);
    const words = textBefore.split(/[\s\n\u00A0]/);
    const word = words[words.length - 1];

    if (word.length > 0 && !/[\u0D00-\u0D7F]/.test(word)) {
        suggestions = await fetchSugg(word);
        activeWord = word;
        activeSuggIdx = 0;
        renderSugg();
    } else {
        clearSugg();
    }
}

function renderSugg() {
    suggBar.innerHTML = '';
    if (suggestions.length === 0) { suggHint.style.display = 'none'; return; }
    suggHint.style.display = 'inline';
    suggBar.appendChild(suggHint);

    suggestions.forEach((word, i) => {
        const chip = document.createElement('span');
        chip.className = `chip${i === activeSuggIdx ? ' active' : ''}`;
        chip.innerHTML = `<span class="chip-num">${i + 1}</span>${word}`;
        chip.onclick = () => applyWord(word, true);
        chip.onmouseenter = () => { activeSuggIdx = i; renderSugg(); };
        suggBar.appendChild(chip);
    });
}

function clearSugg() {
    suggestions = []; activeWord = ''; activeSuggIdx = 0;
    suggBar.innerHTML = ''; suggHint.style.display = 'none';
}

function applyWord(word, appendSpace = true) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const node = sel.anchorNode;
    if (node.nodeType !== Node.TEXT_NODE) return;

    const offset = sel.anchorOffset;
    const text = node.textContent;
    const start = text.lastIndexOf(activeWord, offset);

    if (start !== -1) {
        const addition = appendSpace ? word + '\u00A0' : word;
        const newText = text.substring(0, start) + addition + text.substring(offset);
        node.textContent = newText;
        
        const newRange = document.createRange();
        const newPos = start + addition.length;
        newRange.setStart(node, newPos);
        newRange.setEnd(node, newPos);
        sel.removeAllRanges();
        sel.addRange(newRange);
    }
    clearSugg();
    editor.dispatchEvent(new Event('input'));
}

editor.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.code === 'Space') { e.preventDefault(); toggleLang(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); createNote(); return; }

    if (!mlEnabled || suggestions.length === 0) return;

    if (e.key >= '1' && e.key <= '6') {
        const idx = parseInt(e.key) - 1;
        if (idx < suggestions.length) { 
            e.preventDefault(); 
            applyWord(suggestions[idx], true); 
        }
        return;
    }

    if (e.code === 'Tab' || e.code === 'ArrowRight') {
        e.preventDefault();
        activeSuggIdx = (activeSuggIdx + 1) % suggestions.length;
        renderSugg();
        return;
    }
    if ((e.shiftKey && e.code === 'Tab') || e.code === 'ArrowLeft') {
        e.preventDefault();
        activeSuggIdx = (activeSuggIdx - 1 + suggestions.length) % suggestions.length;
        renderSugg();
        return;
    }

    if (e.code === 'Escape') { e.preventDefault(); clearSugg(); return; }

    if (e.code === 'Space') {
        e.preventDefault();
        applyWord(suggestions[activeSuggIdx], true);
        return;
    }

    if (e.code === 'Enter') {
        e.preventDefault();
        applyWord(suggestions[activeSuggIdx], false);
        execCmd('insertHTML', '<br><br>');
        return;
    }
});

function copyAll() {
    const text = editor.innerText.trim();
    if (!text) { toast('Nothing to copy!'); return; }
    navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard ✓'));
}

function downloadNote(type) {
    const text = type === 'html' ? editor.innerHTML : editor.innerText;
    if (!text.trim()) { toast('Nothing to download!'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type === 'html' ? 'text/html' : 'text/plain;charset=utf-8' }));
    a.download = `manglish_note.${type}`;
    a.click();
    toast(`Downloaded .${type} ✓`);
}

function toggleSidebar() { 
    sidebar.classList.toggle('open'); 
    sidebarOverlay.classList.toggle('open');
}

function closeSidebar() {
    if (window.innerWidth <= 720) {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('open');
    }
}

function toast(msg) {
    const shelf = document.getElementById('toast-shelf');
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    shelf.appendChild(el);
    setTimeout(() => el.remove(), 2500);
}

init();
</script>
